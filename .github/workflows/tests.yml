name: UVP build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev build-essential pkg-config
      - name: Build production daemon and BPF
        run: make build CLANG=/usr/bin/clang
      - name: Test API, matching logic and userspace stop/action/release
        run: make test
      - name: Check JavaScript
        run: node --check web/app.js
